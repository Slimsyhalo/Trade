name: Combined foundation validation and interim evidence handoff
on:
  workflow_dispatch:
  push:
    branches: [codex/c22-foundation-handoff]
    paths: ['.github/workflows/foundation-status.yml']
permissions:
  contents: write
concurrency:
  group: quantlab-foundation-status-independent
  cancel-in-progress: false
jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c22-foundation-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pytest -q > reports/combined_foundation_tests.txt
          cat reports/combined_foundation_tests.txt
          git fetch origin
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Read immutable ledger snapshots and certify only demonstrated evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOUNDATION_LEDGER_BRANCH: codex/c22-foundation-handoff
          CHECKPOINT_SOURCE_SHA: ${{ github.sha }}
        run: python foundation_status.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combined-foundation-validation-diagnostics
          path: |
            reports/combined_foundation_tests.txt
            reports/foundation_acceptance_audit.json
            reports/foundation_workflow_observation.json
          retention-days: 14
