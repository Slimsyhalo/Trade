name: Research foundation operational evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/foundation-observability.yml']
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: quantlab-operational-evidence
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-ops
          fetch-depth: 0
      - name: Load tested audit source without modifying acquisition ledgers
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          mapfile -t source_paths < <(git ls-tree -r --name-only "$SOURCE_SHA" | sed -n '/\.py$/p; /^requirements.lock$/p; /^config.yaml$/p')
          git checkout "$SOURCE_SHA" -- "${source_paths[@]}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Observe immutable source heads and current workflow states
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKPOINT_SOURCE_SHA: ${{ github.sha }}
          OPS_LEDGER_BRANCH: codex/foundation-ops
        run: python foundation_ops_audit.py
