name: Clean source restoration and scientific flow recomputation
on:
  workflow_dispatch:
  push:
    branches: [codex/c18-cloud-recomputation]
    paths: ['.github/workflows/flow-cloud-recovery.yml']
permissions:
  contents: write
concurrency:
  group: quantlab-independent-flow-recomputation
  cancel-in-progress: false
jobs:
  restore-and-recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c18-cloud-recomputation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Restore admitted originals and compare every recomputed output hash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLOW_LEDGER_BRANCH: codex/c18-cloud-recomputation
          CHECKPOINT_SOURCE_SHA: ${{ github.sha }}
        run: python remote_flow.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: independent-flow-diagnostics
          path: |
            reports/flow_cloud_execution.json
            catalog/flow_manifest.json
            data/derived/
            data/flow_sources/
          retention-days: 14
