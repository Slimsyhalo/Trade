name: Official context and reproducible flow evidence
on:
  workflow_dispatch:
  push:
    branches: [codex/c19-context-provenance]
    paths: ['.github/workflows/context-foundation.yml']
permissions:
  contents: write
concurrency:
  group: quantlab-context-writer
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        batch: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c19-context-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preserve exact official releases and temporal provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTEXT_LEDGER_BRANCH: codex/c19-context-provenance
          CHECKPOINT_SOURCE_SHA: ${{ github.sha }}
        run: python remote_context.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: context-batch-${{ matrix.batch }}-diagnostics
          path: |
            catalog/context_manifest.json
            reports/context_execution.json
            data/context/
            data/flow_sources/
            data/derived/
          retention-days: 14
