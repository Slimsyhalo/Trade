name: Verify and publish data pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pilot.yml']
permissions:
  contents: write
concurrency:
  group: quantlab-data-writer
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - name: Configure checkpoint author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish and restore bounded pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python remote_pilot.py
