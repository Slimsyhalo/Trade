name: Source-version surveillance and restored schema audit
on:
  workflow_dispatch:
  push:
    branches: [codex/c21-source-version-audit]
    paths: ['.github/workflows/source-version-audit.yml']
permissions:
  contents: write
concurrency:
  group: quantlab-source-watch-independent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c21-source-version-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pytest -q > reports/source_watch_tests.txt
          cat reports/source_watch_tests.txt
          git fetch origin main codex/c17-archive-expansion codex/c18-cloud-recomputation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Probe official checksums and restore actual schema source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_AUDIT_BRANCH: codex/c21-source-version-audit
          CHECKPOINT_SOURCE_SHA: ${{ github.sha }}
        run: |
          python remote_schema_audit.py
          git add reports/source_watch_tests.txt
          git commit -m 'C21 hosted validation tests' || test -z "$(git status --porcelain reports/source_watch_tests.txt)"
          git push origin HEAD:refs/heads/codex/c21-source-version-audit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-version-watch-diagnostics
          path: |
            reports/source_version_observations.json
            reports/source_watch_tests.txt
            catalog/schema_registry.json
            data/restored/schema/
          retention-days: 14
