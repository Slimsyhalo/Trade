schema_version: 1
requested_window: {start: '2024-10-07', end_inclusive: '2026-10-07', timezone: UTC}
research_only: true
phase_1_accepted: false
sources:
  binance_archive:
    provider: Binance Vision
    reference: https://github.com/binance/binance-public-data
    terms: https://github.com/binance/binance-public-data/blob/master/TERMS_AND_CONDITIONS.md
    cost: {access: free, account_required: false, commercial_authorization: false, dataset_license: CC-BY-NC-SA-4.0}
    quota: No fixed archive quota assumed; one request/second; respect rate/restriction responses
    temporal_policy: Original source timestamps retained; publication latency unknown unless explicitly observed
  binance_rest:
    provider: Binance USD-M public REST
    reference: https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-usd-s-m-futures/api/rest-api/market-data
    terms: https://www.binance.com/en/terms
    cost: {access: free, account_required: false}
    quota: Endpoint-specific IP weights and retention; current exchangeInfo limits must be captured
    temporal_policy: Keep exchange timestamp and received timestamp; no historical availability inference
  binance_ws:
    provider: Binance USD-M public WebSocket
    reference: https://developers.binance.com/en/docs/products/derivatives-trading-usds-futures/websocket-market-streams/Important-WebSocket-Change-Notice
    terms: https://www.binance.com/en/terms
    cost: {access: free, account_required: false}
    quota: Routed public/market connections, heartbeats/reconnects; bounded payload queues
    temporal_policy: Exchange ms and local receive ns; local clock calibration still required
  bls:
    provider: US Bureau of Labor Statistics
    reference: https://www.bls.gov/bls/newsrels.htm
    terms: https://www.bls.gov/bls/linksite.htm
    cost: {access: free, account_required: false}
    quota: Public release documents; cache and pace; API registration is separate from archived releases
    temporal_policy: Release header time America/New_York with DST; original release and revisions kept separately
  fed:
    provider: Federal Reserve
    reference: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    terms: https://www.federalreserve.gov/disclaimer.htm
    cost: {access: free, account_required: false}
    quota: Public calendar and dated release documents; paced acquisition
    temporal_policy: Original publication header and IANA America/New_York; scheduled time is not effective received time
  alfred:
    provider: Federal Reserve Bank of St Louis ALFRED
    reference: https://fred.stlouisfed.org/docs/api/fred/realtime_period.html
    terms: https://fred.stlouisfed.org/legal/
    cost: {access: free_with_key, account_required: true}
    quota: API key and endpoint policies; do not assume unbounded calls
    temporal_policy: Vintage dates preserve revisions; day-level real-time metadata is not an intraday publication timestamp
  gdelt:
    provider: GDELT
    reference: https://www.gdeltproject.org/data.html
    terms: https://www.gdeltproject.org/about.html
    cost: {access: free_archive, account_required: false, bigquery_paid_queries_authorized: false}
    quota: Fifteen-minute archives; full global graph is TB scale, use justified filters
    temporal_policy: Discovery/first-seen time differs from original article publication; article edits and missing coverage explicit
  coingecko:
    provider: CoinGecko
    reference: https://docs.coingecko.com/reference/coins-id-market-chart-range
    terms: https://www.coingecko.com/en/api_terms
    cost: {access: plan_dependent, account_required: true, paid_authorized: false}
    quota: Historical depth and granularity depend on plan; no two-year free coverage assumed
    temporal_policy: Aggregated provider timestamps and revisions; not executable exchange ticks
  coinmetrics:
    provider: Coin Metrics Community
    reference: https://gitbook-docs.coinmetrics.io/packages/coin-metrics-community-data
    terms: https://coinmetrics.io/terms-and-conditions/
    cost: {access: community_subset_free, account_required: false, paid_authorized: false}
    quota: Community subset only; bounded API dates and pagination; per-asset availability must be probed
    temporal_policy: Daily metric time and retrieval time; provider methodology/revisions and publication delay required
  tardis:
    provider: Tardis.dev
    reference: https://docs.tardis.dev/faq/general
    terms: https://tardis.dev/terms
    cost: {access: provider_subscription_or_sample, paid_authorized: false, public_redistribution_authorized: false}
    quota: Exchange/channel/date-specific coverage; subscription and redistribution rights required
    temporal_policy: Exchange plus provider receive time; vendor gaps remain possible
  kaiko:
    provider: Kaiko
    reference: https://docs.kaiko.com/explore-our-data/data-dictionary
    terms: https://www.kaiko.com/
    cost: {access: commercial_contract, paid_authorized: false, public_redistribution_authorized: false}
    quota: Product/venue-specific coverage and rate limits; commercial quote required
    temporal_policy: Vendor snapshots/trades with data-version metadata; not guaranteed gap-free event-level L2
  cboe:
    provider: Cboe
    reference: https://www.cboe.com/tradable-products/vix/vix-historical-data
    terms: https://www.cboe.com/us/legal/
    cost: {access: public_daily_or_licensed_intraday, public_redistribution_authorized: false, paid_authorized: false}
    quota: Daily public history differs from paid intraday/index redistribution licenses
    temporal_policy: End-of-day observations are unavailable at day's open; precise publication timing unproven
  coinbase:
    provider: Coinbase Exchange
    reference: https://docs.cdp.coinbase.com/exchange/reference/exchangerestapi_getproductcandles
    terms: https://www.coinbase.com/legal/user_agreement/united_states
    cost: {access: public_market_data, paid_authorized: false}
    quota: Bounded candle queries; per-product retention/completeness must be validated
    temporal_policy: Exchange candle times plus received time; missing intervals must not be fabricated
  sec:
    provider: US SEC
    reference: https://www.sec.gov/newsroom/press-releases
    terms: https://www.sec.gov/about/privacy-information
    cost: {access: public, account_required: false}
    quota: SEC fair-access limits and declared client identification; public announcements, not universal regulatory coverage
    temporal_policy: Original publication metadata plus received/revision timestamps; no retrospective edit substitution
  ecb:
    provider: ECB
    reference: https://www.ecb.europa.eu/press/govcdec/mopo/html/index.en.html
    terms: https://www.ecb.europa.eu/services/disclaimer/html/index.en.html
    cost: {access: public, account_required: false}
    quota: Paced public document acquisition and caching
    temporal_policy: Original release time Europe/Berlin with DST; corrections separately versioned
